package: GaudiPfoMonitoring
namespace: GaudiPfoMonitoring
name: PfoMonData
collection_id: 1001
members:
  - name: energy
    type: float
    description: "Reconstructed energy of the PFO"
  - name: pdg
    type: int32_t
    description: "PDG code assigned to the reconstructed PFO"
  - name: fNeutral
    type: float
    description: "Fraction of hadronic energy from neutral MC particles"
  - name: fPhoton
    type: float
    description: "Fraction of hadronic energy from photons (MC)"
  - name: fCharged
    type: float
    description: "Fraction of hadronic energy from charged MC particles"
  - name: px
    type: float
    description: "Momentum X component"
  - name: py
    type: float
    description: "Momentum Y component"
  - name: pz
    type: float
    description: "Momentum Z component"
  - name: mass
    type: float
    description: "Reconstructed mass"
  - name: nClusters
    type: uint32_t
    description: "Number of clusters associated with this PFO"
  - name: nEmClusters
    type: uint32_t
    description: "Number of EM-identified clusters in the PFO"
  - name: nHits
    type: uint32_t
    description: "Total number of calorimeter hits in the PFO"
  - name: nMipLikeHits
    type: uint32_t
    description: "Number of hits tagged as MIP-like"
  - name: nEcalHits
    type: uint32_t
    description: "Number of hits in the ECAL"
  - name: nMipEcalHits
    type: uint32_t
    description: "Number of MIP-like hits in the ECAL"
  - name: nHcalHits
    type: uint32_t
    description: "Number of hits in the HCAL"
  - name: nMipHcalHits
    type: uint32_t
    description: "Number of MIP-like hits in the HCAL"
  - name: minClusterDistance
    type: float
    description: "Minimum distance between PFO clusters and the most energetic cluster in event"
  - name: startLayer
    type: uint32_t
    description: "Innermost pseudo-layer occupied by PFO clusters"
  - name: nLayers
    type: uint32_t
    description: "Number of layers spanned by the PFO clusters"
  - name: hasMatchedMcParticle
    type: uint32_t
    description: "1 if the PFO has a matched MC particle (MC deposited at least the configured energy fraction of the PFO energy), 0 otherwise"
  - name: matchedMcPdg
    type: int32_t
    description: "PDG code of the matched MC particle for this PFO (the winning contributor above the energy-fraction cut), 0 if no match"
  - name: matchedMcEnergy
    type: float
    description: "Energy of the matched MC particle for this PFO, 0 if no match"
  - name: matchedMcAlpha
    type: float
    description: "Opening angle between the PFO momentum and the momentum of the matched MC particle (the same particle as matchedMcPdg); -1 if no match"
